services:
  nextread:
    # The published image, and the source it is built from. Both, deliberately:
    # `docker compose up -d --build` builds locally and tags it with this name,
    # so this host runs the same image everybody else pulls rather than a
    # private variant nobody would notice breaking. `docker compose pull` gets
    # the published one instead, once the package is public.
    #
    # Built for linux/amd64 and linux/arm64. This host is aarch64 and GitHub's
    # runners are not, so a single-arch image would push green and then refuse
    # to start here.
    image: ghcr.io/matalvernaz/nextread:latest
    build: .
    container_name: nextread
    restart: unless-stopped
    environment:
      # Jellyfin is the single library of record.
      JELLYFIN_URL: "http://jellyfin:8096"
      # Read from .env beside this file, which is gitignored.
      JELLYFIN_TOKEN: "${JELLYFIN_TOKEN}"
      # Supplied by the Keycloak forward-auth middleware. JELLYFIN_USER is the
      # direct-access fallback and keeps Matt's existing unsuffixed playlist.
      AUTH_USER_HEADER: "X-Auth-Request-Preferred-Username"
      JELLYFIN_USER: "matt"
      # Audio Books, Graphic audio
      LIBRARY_IDS: "3aeb99515c5a4d67fe12f482a99e3d6c,37d6a841204ee1d6e58b0d35b973f7cc"
      # Listenarr is a write-only acquisition sink plus a queue-state read.
      LISTENARR_URL: "http://listenarr:4545"
      LISTENARR_QUALITY_PROFILE_ID: "1"
      PLAYLIST_NAME: "Next Read"
      # Non-keyholders only; Jellyfin administrators are uncapped.
      WANT_DAILY_CAP: "3"
      STILL_LOOKING_AFTER_HOURS: "12"
      LOG_LEVEL: "INFO"
      # Where clients reach the API at the Jellyfin origin. Used only to check
      # that route is really there: without it the app finds nothing and says
      # nothing, and nobody learns why. See the nextread-jellyfin router below.
      PUBLIC_URL: "https://jellyfin.thealvernaz.space/nextread"
      DB_PATH: "/data/nextread.db"
      TZ: "America/Vancouver"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - traefik.enable=true
      - "traefik.http.routers.nextread.rule=Host(`nextread.thealvernaz.space`) || Host(`www.nextread.thealvernaz.space`)"
      - traefik.http.routers.nextread.entrypoints=websecure
      - traefik.http.routers.nextread.middlewares=www-to-nonwww@file,access-nextread@file
      # Pinned low so the bypass routers below outrank it. Traefik v3 derives
      # priority from rule LENGTH when it is not set, so adding a Host() clause
      # here would otherwise silently swallow their paths.
      - traefik.http.routers.nextread.priority=10
      - traefik.http.routers.nextread.tls=true
      - traefik.http.routers.nextread.tls.certresolver=le-dns
      - traefik.http.routers.nextread.tls.domains[0].main=nextread.thealvernaz.space
      - traefik.http.routers.nextread.tls.domains[0].sans=www.nextread.thealvernaz.space
      - traefik.http.services.nextread.loadbalancer.server.port=8080
      # The JSON API authenticates callers itself, by introspecting the Jellyfin
      # access token they send. It has to bypass SSO because a native app cannot
      # complete an oauth2-proxy browser flow. /, /want and /dismiss keep theirs.
      - "traefik.http.routers.nextread-api.rule=Host(`nextread.thealvernaz.space`) && PathPrefix(`/api/`)"
      - traefik.http.routers.nextread-api.entrypoints=websecure
      - traefik.http.routers.nextread-api.tls=true
      - traefik.http.routers.nextread-api.tls.certresolver=le-dns
      - traefik.http.routers.nextread-api.service=nextread
      - traefik.http.routers.nextread-api.priority=100
      # The same API, reachable at the Jellyfin origin, so a client that already
      # knows where Jellyfin is needs no second address typed into it. Copied
      # from the echofin-share gateway, which EchoFin already discovers this way
      # by probing the origin it is signed in to.
      #
      # ONLY /nextread/api. The page authenticates from the forward-auth header
      # and `_viewer` falls back to the configured user when there is none, and
      # the jellyfin host is access level Open -- so serving the page here would
      # hand anyone who reached it that account. The API introspects a Jellyfin
      # token and is already SSO-free on its own host, so this router adds no
      # exposure that does not exist today.
      #
      # Both hosts: EchoFin moves between them, and the derived address follows
      # whichever one it is on, which is what keeps Discover on the LAN at home
      # instead of out through Cloudflare and back.
      - "traefik.http.routers.nextread-jellyfin.rule=(Host(`jellyfin.thealvernaz.space`) || Host(`jellyfin-lan.thealvernaz.space`)) && PathPrefix(`/nextread/api`)"
      - traefik.http.routers.nextread-jellyfin.entrypoints=websecure
      # 200, matching echofin-share: it has to outrank Jellyfin's own Host()
      # router, whose rule is shorter but which would otherwise take the path.
      - traefik.http.routers.nextread-jellyfin.priority=200
      # A docker label, not an @file middleware. A middleware named @file that
      # does not exist drops the router silently and the host 404s with nothing
      # in the log, which is a documented way to lose an afternoon here.
      - traefik.http.routers.nextread-jellyfin.middlewares=nextread-strip
      - traefik.http.middlewares.nextread-strip.stripprefix.prefixes=/nextread
      - traefik.http.routers.nextread-jellyfin.service=nextread
      - traefik.http.routers.nextread-jellyfin.tls=true
      - traefik.http.routers.nextread-jellyfin.tls.certresolver=le-dns
      - traefik.http.routers.nextread-jellyfin.tls.domains[0].main=jellyfin.thealvernaz.space
      - traefik.http.routers.nextread-jellyfin.tls.domains[1].main=jellyfin-lan.thealvernaz.space
      - "traefik.http.routers.nextread-public.rule=Host(`nextread.thealvernaz.space`) && PathPrefix(`/favicon`)"
      - traefik.http.routers.nextread-public.entrypoints=websecure
      - traefik.http.routers.nextread-public.tls=true
      - traefik.http.routers.nextread-public.tls.certresolver=le-dns
      - traefik.http.routers.nextread-public.service=nextread
      - traefik.http.routers.nextread-public.priority=100
    networks:
      - traefik

networks:
  traefik:
    external: true
